
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>なちなさんの自己紹介</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #fff8e9, #e8f2e6);
      font-family: "Yu Gothic", sans-serif;
      color: #4c5141;
    }

    .profile {
      width: 100%;
      max-width: 650px;
      padding: 45px 30px;
      text-align: center;
      background: white;
      border-radius: 28px;
      box-shadow: 0 15px 40px #7773;
    }

    .sun {
      font-size: 55px;
    }

    .subtitle {
      color: #99966d;
      letter-spacing: 5px;
    }

    h1 {
      font-size: 52px;
      color: #78865e;
      margin: 15px 0;
    }

    .message {
      line-height: 2;
      color: #777866;
      margin-bottom: 30px;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .item {
      padding: 22px;
      background: #faf8ef;
      border-radius: 18px;
    }

    .item h2 {
      color: #92936b;
      font-size: 17px;
    }

    .item p {
      font-size: 20px;
      line-height: 1.8;
    }

    button {
      margin-top: 25px;
      padding: 12px 25px;
      border: none;
      border-radius: 25px;
      background: #87966c;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #687a50;
    }

    #greeting {
      margin-top: 15px;
      color: #78865e;
      font-weight: bold;
    }

    footer {
      margin-top: 30px;
      color: #aaa58e;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .details {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

  <main class="profile">

    <div class="sun">☀️</div>

    <p class="subtitle">MY PROFILE</p>

    <h1>なちな</h1>

    <p class="message">
      こんにちは！<br>
      毎日をのんびり、自分らしく楽しんでいます。
    </p>

    <section class="details">

      <div class="item">
        <h2>🌸 年齢</h2>
        <p>88歳</p>
      </div>

      <div class="item">
        <h2>🌷 趣味</h2>
        <p>
          旅行<br>
          日向ぼっこ ☀️
        </p>
      </div>

    </section>

    <button onclick="showGreeting()">
      ボタンを押してね♪
    </button>

    <div id="greeting"></div>

    <footer>
      見に来てくれてありがとうございます。
    </footer>

  </main>

  <script>
    function showGreeting() {
      document.getElementById("greeting").textContent =
        "今日も素敵な一日になりますように！🌼";
    }
  </script>

</body>
</html>
